{%- if include.value -%}
<div class="exp-detail__meta-item">
  <span class="exp-detail__meta-icon" aria-hidden="true">
    {%- case include.icon -%}
    {%- when "date" %}<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    {%- when "altitude" %}<svg viewBox="0 0 24 24"><path d="M2 20 9 7l4 7 2-3 7 9z"/></svg>
    {%- when "duration" %}<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    {%- when "difficulty" %}<svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
    {%- when "route" %}<svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/></svg>
    {%- when "team" %}<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>
    {%- endcase %}
  </span>
  <div>
    <span class="exp-detail__meta-label">{{ include.label }}</span>
    <span class="exp-detail__meta-value">{{ include.value }}</span>
  </div>
</div>
{%- endif -%}
